<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>OBS Markers</title>
<style>
  :root {
    --bg: #101010;
    --surface: #141416;
    --border: #181819;
    --border-bright: #26262b;
    --accent: #162458;
    --accent-hover: #1f347e;
    --accent-border: #1f347e;
    --text: #ffffff;
    --text-dim: #8e8e93;
    --text-muted: #55555c;
    --freeze-flash: rgba(0, 210, 255, 0.85); /* Electric Cyan #00d2ff */
    --red-undo: #ef4444;
    --red-undo-bg: rgba(239, 68, 68, 0.25);
    --red-undo-border: rgba(239, 68, 68, 0.6);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  body {
    padding: 4px 5px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    border: 2px solid var(--border);
    position: relative;
  }

  /* Full Frame Blue Freeze Flash Overlay (ONLY on F8/Keybind note freeze) */
  .dock-freeze-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
    pointer-events: none;
    background: var(--freeze-flash);
    z-index: 9998;
  }

  /* UNIFIED ROW 1 (Height 22px): Clock Icon | Input with Badge | Save | Action */
  .dock-row-unified {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    width: 100%;
    flex-shrink: 0;
  }

  /* Clock Icon Button (Freeze / Re-grab Time) */
  .btn-clock {
    width: 22px;
    height: 22px;
    background-color: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent-border);
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .btn-clock:hover:not(:disabled) {
    background-color: var(--accent-hover);
  }

  .btn-clock.picked {
    background-color: var(--accent);
    border-color: #00d2ff;
    color: #00d2ff;
  }

  .btn-clock.stale {
    opacity: 0.55;
  }

  .btn-clock:disabled {
    background-color: var(--bg);
    color: var(--text-muted);
    border-color: #181819;
    cursor: not-allowed;
  }

  .btn-clock svg {
    pointer-events: none;
  }

  /* Input Field Container with Embedded Saved Counter Badge */
  .input-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    transition: margin-left 0.15s ease;
  }

  .dock-input {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border: 1px solid #202024;
    border-radius: 3px;
    color: #ffffff;
    padding: 0 6px 0 6px; /* Stopped state: full width, no badge padding */
    font-size: 10.5px;
    outline: none;
    text-overflow: ellipsis;
    /* 500ms transition for green frame fade, matching the Undo button 1:1 */
    transition: border-color 0.5s ease, box-shadow 0.5s ease, padding 0.15s ease;
  }

  .dock-input:focus {
    border-color: var(--accent);
  }

  .dock-input:disabled {
    background: #0d0d0e;
    color: var(--text-muted);
    cursor: not-allowed;
    border-color: #181819;
  }

  /* Green Frame Feedback on Save (Muted Sage) */
  .dock-input.state-saved {
    border-color: #2e5c46 !important;
    box-shadow: none !important;
  }

  .dock-input.state-saved::placeholder {
    color: #5ea87f !important;
  }

  /* Counter Badge Inside Input (Hidden when stopped, shown ONLY when recording) */
  .input-counter-badge {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9.5px;
    color: var(--text-muted);
    pointer-events: none;
    white-space: nowrap;
    font-family: inherit;
    display: none; /* Hidden by default when stopped */
  }

  /* RECORDING STATE MODIFIERS (-50% left padding & reduced margin) */
  body.recording .input-wrap {
    margin-left: -2px; /* -50% of left gap */
  }

  body.recording .dock-input {
    padding: 0 32px 0 3px; /* -50% left padding (3px vs 6px), 32px right padding for compact Xmrks */
  }

  body.recording .input-counter-badge {
    display: block; /* Visible ONLY when recording */
  }

  /* Save Button */
  .btn-save {
    background-color: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 3px;
    padding: 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    height: 100%;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .btn-save:hover:not(:disabled) {
    background-color: var(--accent-hover);
  }

  .btn-save:disabled {
    background-color: var(--bg);
    color: var(--text-muted);
    border: 1px solid #181819;
    cursor: not-allowed;
  }

  /* Action Button (X / Red Undo) with 500ms Crossfade */
  .btn-action {
    width: 22px;
    height: 22px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    flex-shrink: 0;
    position: relative;
    transition: background 0.5s ease, border-color 0.5s ease, color 0.5s ease;
  }

  .btn-action svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .btn-action.state-idle {
    background-color: var(--bg);
    color: var(--text-muted);
    border: 1px solid #181819;
    cursor: default;
  }

  .btn-action.state-active {
    background-color: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent-border);
    cursor: pointer;
  }

  .btn-action.state-undo {
    background-color: var(--red-undo-bg);
    color: var(--red-undo);
    border: 1px solid var(--red-undo-border);
    cursor: pointer;
  }

  .btn-action.state-undo:hover {
    background-color: rgba(239, 68, 68, 0.4);
    color: #ffffff;
  }

  /* ROW 2 (Height 18px): Presets + Morphing Adder ONLY (Clean, No Gear Icon) */
  .dock-row-chips {
    display: flex;
    align-items: center;
    gap: 3px;
    overflow-x: auto;
    scrollbar-width: none;
    height: 18px;
    flex-shrink: 0;
  }

  .dock-row-chips::-webkit-scrollbar { display: none; }

  .chip-container {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    height: 18px;
  }

  /* Tag Chip: Clean, no hover X, right-click deletes */
  .dock-chip {
    background: #161619;
    border: 1px solid #222226;
    color: #c7c7cc;
    font-size: 9.5px;
    font-weight: 500;
    padding: 0 6px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 18px;
    line-height: 18px;
    box-sizing: border-box;
    transition: all 0.12s ease;
  }

  .dock-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent-hover);
  }

  /* In-place morphing tag button / input */
  .btn-tag-morph {
    background: transparent;
    border: 1px dashed #303038;
    color: #71717a;
    font-size: 9.5px;
    padding: 0 5px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    height: 18px;
    line-height: 18px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-tag-morph:hover {
    color: #ffffff;
    border-color: #60a5fa;
  }

  .input-tag-morph {
    background: #0f0f12;
    border: 1px solid #3b82f6;
    color: #ffffff;
    font-size: 9.5px;
    padding: 0 4px;
    border-radius: 2px;
    width: 58px;
    outline: none;
    height: 18px;
    line-height: 18px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <!-- Full Frame Blue Freeze Flash Layer (ONLY on Keybind Freeze) -->
  <div class="dock-freeze-layer" id="dockFreezeOverlay"></div>

  <!-- UNIFIED ROW 1 (22px): Clock Icon | Description Box with Counter Badge | Save | Action -->
  <div class="dock-row-unified">
    <!-- Clock Icon Button: Click to Freeze / Re-grab Time -->
    <button class="btn-clock" id="btnClock" onclick="handleClockClick()" title="Freeze exact timecode" disabled>
      <!-- Clock Plus Icon (Idle) -->
      <svg id="iconClockPlus" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6v6l3.644 1.822"/>
        <path d="M16 19h6"/>
        <path d="M19 16v6"/>
        <path d="M21.92 13.267a10 10 0 1 0-8.653 8.653"/>
      </svg>
      <!-- Clock Check Icon (Picked / Frozen) -->
      <svg id="iconClockCheck" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.95 13a10 10 0 1 0-8.685 8.92"/>
        <path d="M12 6v6l4 2"/>
        <path d="m16 19 2 2 4-4"/>
      </svg>
    </button>

    <!-- Input Box with Full-Width Stopped Placeholder & Dynamic Embedded Badge -->
    <div class="input-wrap">
      <input type="text" id="dockInput" class="dock-input" placeholder="Start rec to begin marking" title="Start recording in OBS to enable markers" autocomplete="off" disabled>
      <span class="input-counter-badge" id="dockCounter"></span>
    </div>

    <!-- Save Button (Enabled only when text is entered) -->
    <button class="btn-save" id="btnSave" onclick="handleSaveAction()" disabled>Save</button>

    <!-- Contextual Action Button (X / Red Undo) -->
    <button class="btn-action state-idle" id="btnAction" onclick="handleActionButtonClick()" title="Cancel / Undo">
      <!-- X Icon -->
      <svg id="iconX" style="opacity: 1;" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <!-- Lucide Undo-2 SVG Icon -->
      <svg id="iconUndo" style="opacity: 0;" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 14 4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>
      </svg>
    </button>
  </div>

  <!-- ROW 2 (18px): Presets + Morphing Adder ONLY (No Gear Icon) -->
  <div class="dock-row-chips" id="chipScrollRow">
    <div class="chip-container" id="chipContainer"></div>
    <div id="tagMorphWrap" style="flex-shrink: 0; height: 18px; display: flex; align-items: center;">
      <button class="btn-tag-morph" id="btnTagMorph" onclick="morphToInput()">+ tag</button>
    </div>
  </div>

<script>
  // --- STATE ---
  let isRecording = false;
  let currentRecordingTimecode = "00:00:00";
  let selectedTimestamp = null;
  let savedMarkersCount = 0;
  let undoTimer = null;
  let savedStateTimer = null;
  let isUndoActive = false;
  let isSavedActive = false;
  let obsSocket = null;
  const WS_PORTS = [4456, 4455];
  let portIndex = 0;
  let lastKnownFreezeTime = null;
  let lastFreezeHandledAt = 0;
  let pendingFreeze = false;
  let wsAuthRequired = false;
  let isPaused = false;
  let isResuming = false;
  let resumeFallbackTimer = null;
  let pausedWarnTimer = null;
  let lastTimecodeAt = 0;
  let staleFallbackTimer = null;
  let currentFpsNum = 60;
  let currentFpsDen = 1;
  // Daemon port discovery: the dock is normally same-origin
  // (http://127.0.0.1:<port>/), so apiBase stays "". Under file:///
  // (detached testing) we probe 8765-8770 for the live daemon.
  let apiBase = "";
  let serverPort = (location.port || "8765").toString();

  function apiUrl(path) {
    return apiBase + path;
  }

  function portSuffix() {
    return (serverPort && serverPort !== "8765") ? ` (port: ${serverPort})` : "";
  }

  function discoverDaemonPort() {
    if (location.protocol !== "file:") return;
    const ports = [8765, 8766, 8767, 8768, 8769, 8770];
    let i = 0;
    const tryNext = () => {
      if (i >= ports.length) return;
      const p = ports[i++];
      fetch(`http://127.0.0.1:${p}/api/status`)
        .then(res => res.json())
        .then(data => {
          if (data && (typeof data.markers_count === "number" || data.port)) {
            apiBase = `http://127.0.0.1:${p}`;
            serverPort = String((data && data.port) || p);
            updateFpsTooltip();
            pollServerSync();
          } else {
            tryNext();
          }
        })
        .catch(tryNext);
    };
    tryNext();
  }

  function fpsLabel() {
    const f = currentFpsNum / currentFpsDen;
    return (Math.round(f * 100) / 100).toString();
  }

  // Stale = recording live (not paused) but no fresh OBS timecode for >1.5s
  // (WebSocket down or OBS not answering). Pauses hold time intentionally,
  // so they must never count as stale.
  function isStale() {
    return isRecording && !isPaused && (Date.now() - lastTimecodeAt > 1500);
  }

  function refreshStaleClock() {
    const btn = document.getElementById('btnClock');
    if (!btn) return;
    btn.classList.toggle('stale', isStale() && !selectedTimestamp);
  }

  function updateFpsTooltip() {
    const btn = document.getElementById('btnClock');
    if (!btn) return;
    const suffix = portSuffix();
    if (selectedTimestamp) {
      btn.title = `Time frozen: ${selectedTimestamp} @${fpsLabel()}fps${suffix} (click to re-grab)`;
    } else if (isStale()) {
      btn.title = `Timecode stale (>1.5s) - check WebSocket @${fpsLabel()}fps${suffix}`;
    } else {
      btn.title = `Freeze exact timecode @${fpsLabel()}fps${suffix}`;
    }
    refreshStaleClock();
  }

  // Presets in localStorage
  let userPresets = JSON.parse(localStorage.getItem('obs_marker_chips_v5') || '["Ace", "Clutch", "Funny", "Dono", "Whiff"]');

  // Horizontal wheel scroll for chips
  const chipRow = document.getElementById('chipScrollRow');
  chipRow.addEventListener('wheel', (e) => {
    e.preventDefault();
    chipRow.scrollLeft += e.deltaY;
  }, { passive: false });

  // Update counter badge formatting ("Xmrks")
  function updateMarkerCounter() {
    const counterEl = document.getElementById('dockCounter');
    if (!counterEl) return;
    if (isRecording) {
      counterEl.textContent = `${savedMarkersCount}mrks`;
    } else {
      counterEl.textContent = '';
    }
  }

  // --- BLUE FREEZE FLASH (ONLY on Keybind Note Freeze) ---
  // Electric Cyan #00d2ff (60ms attack / 1200ms decay / 85% opacity)
  function triggerFreezeFlash() {
    const overlay = document.getElementById('dockFreezeOverlay');
    overlay.style.background = '';
    overlay.style.transition = 'opacity 60ms ease-in';
    overlay.style.opacity = '0.85';

    setTimeout(() => {
      overlay.style.transition = 'opacity 1200ms ease-out';
      overlay.style.opacity = '0';
    }, 60);
  }

  // --- AMBER PAUSED WARNING FLASH (F8 while recording is paused) ---
  // Same attack/decay envelope as the cyan flash so it reads instantly
  // in peripheral vision, but unmistakably amber (#f59e0b). Fires WITHOUT
  // capturing any timestamp.
  function triggerPausedWarning() {
    const overlay = document.getElementById('dockFreezeOverlay');
    overlay.style.background = 'rgba(245, 158, 11, 0.8)';
    overlay.style.transition = 'opacity 60ms ease-in';
    overlay.style.opacity = '0.8';

    setTimeout(() => {
      overlay.style.transition = 'opacity 1200ms ease-out';
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.background = ''; }, 1300);
    }, 60);

    const input = document.getElementById('dockInput');
    if (input && !isSavedActive) {
      const prevPh = input.placeholder;
      const prevTitle = input.title;
      input.placeholder = 'Cannot capture - recording is paused';
      input.title = 'Resume recording to capture markers';
      clearTimeout(pausedWarnTimer);
      pausedWarnTimer = setTimeout(() => {
        if (input.placeholder === 'Cannot capture - recording is paused') {
          input.placeholder = isRecording ? 'Paused - time held...' : prevPh;
          input.title = isRecording ? 'Recording paused - resume to grab fresh timecode' : prevTitle;
        }
      }, 1800);
    }
  }

  // --- GREEN FRAME & "Saved!" GHOST TEXT FEEDBACK ON SAVE ---
  // Stays for 5s, then 500ms fade back to normal, matching the Red Undo button 1:1
  function triggerSavedInputFeedback() {
    isSavedActive = true;
    const input = document.getElementById('dockInput');
    input.classList.add('state-saved');
    input.placeholder = 'Saved!';

    clearTimeout(savedStateTimer);
    savedStateTimer = setTimeout(() => {
      clearSavedInputFeedback();
    }, 5000);
  }

  function clearSavedInputFeedback() {
    clearTimeout(savedStateTimer);
    isSavedActive = false;
    const input = document.getElementById('dockInput');
    input.classList.remove('state-saved');
    if (isRecording) {
      input.placeholder = 'Description...';
    } else {
      input.placeholder = 'Start rec to begin marking';
    }
  }

  // --- CLOCK ICON BUTTON (CLICK IN UI) ---
  // Clicking the UI clock button freezes the timestamp WITHOUT triggering the blue sensory flash
  function handleClockClick() {
    if (!isRecording || isPaused) return;
    applyFreezeState();
  }

  // --- KEYBIND FREEZE (F8 / IN-GAME GLOBAL HOTKEY) ---
  // Keybind note trigger: fires the Electric Cyan #00d2ff blue sensory flash
  // Debounced to 300ms so dock F8 keydown + server flag poll don't double-fire.
  // While paused the press is NOT captured; an amber warning flashes instead
  // so the streamer knows to resume (no silent black hole).
  function handleKeybindFreeze() {
    if (!isRecording) return;
    if (isPaused) {
      const nowWarn = Date.now();
      if (nowWarn - lastFreezeHandledAt < 300) return;
      lastFreezeHandledAt = nowWarn;
      triggerPausedWarning();
      return;
    }
    const now = Date.now();
    if (now - lastFreezeHandledAt < 300) return;
    lastFreezeHandledAt = now;
    triggerFreezeFlash();
    applyFreezeState(true);
  }

  function applyFreezeState(fromHotkey) {
    // If we just resumed - or the OBS timecode is stale (WS down) - the
    // cached value can't be trusted. Defer the lock until a fresh
    // GetRecordStatus lands (1500ms fallback releases the guard).
    if (isResuming || isStale()) {
      pendingFreeze = true;
      queryRecordStatus();
      const btnR = document.getElementById('btnClock');
      btnR.classList.add('picked');
      btnR.title = 'Syncing timecode...';
      document.getElementById('iconClockPlus').style.display = 'none';
      document.getElementById('iconClockCheck').style.display = 'block';
      updateUIStates();
      const inputR = document.getElementById('dockInput');
      if (inputR && !inputR.disabled) {
        inputR.focus();
      }
      // Never wedge: if no fresh timecode arrives (dead socket), fall back
      // to the last-known value instead of leaving Syncing... forever.
      clearTimeout(staleFallbackTimer);
      staleFallbackTimer = setTimeout(() => {
        if (pendingFreeze && !selectedTimestamp) {
          pendingFreeze = false;
          selectedTimestamp = currentRecordingTimecode;
          updateFpsTooltip();
          updateUIStates();
        }
      }, 1500);
      return;
    }
    // Request a fresh timecode, then freeze when the response arrives.
    // Falls back to last known timecode immediately so UI feels instant.
    pendingFreeze = true;
    queryRecordStatus();
    selectedTimestamp = currentRecordingTimecode;

    const btn = document.getElementById('btnClock');
    btn.classList.add('picked');

    document.getElementById('iconClockPlus').style.display = 'none';
    document.getElementById('iconClockCheck').style.display = 'block';

    updateFpsTooltip();
    updateUIStates();

    const input = document.getElementById('dockInput');
    if (input && !input.disabled) {
      input.focus();
    }
  }

  function applyFreshFreeze(timecode) {
    if (!pendingFreeze) return;
    pendingFreeze = false;
    clearTimeout(staleFallbackTimer);
    if (!timecode) return;
    selectedTimestamp = timecode;
    const btn = document.getElementById('btnClock');
    btn.classList.add('picked');
    updateFpsTooltip();
    updateUIStates();
  }

  function resetClockButton() {
    selectedTimestamp = null;
    pendingFreeze = false;
    clearTimeout(staleFallbackTimer);
    const btn = document.getElementById('btnClock');
    btn.classList.remove('picked');

    document.getElementById('iconClockPlus').style.display = 'block';
    document.getElementById('iconClockCheck').style.display = 'none';

    updateFpsTooltip();
    updateUIStates();
  }

  // --- UI STATES (SAVE BUTTON & ACTION BUTTON) ---
  function updateUIStates() {
    const inputVal = document.getElementById('dockInput').value.trim();
    const btnSave = document.getElementById('btnSave');

    // Save button is ONLY enabled if actively recording AND input has non-empty text!
    btnSave.disabled = (!isRecording || inputVal.length === 0);

    if (isUndoActive) return;

    const btn = document.getElementById('btnAction');
    const hasContent = (inputVal.length > 0 || selectedTimestamp !== null);

    document.getElementById('iconX').style.opacity = '1';
    document.getElementById('iconUndo').style.opacity = '0';

    btn.classList.remove('state-undo');
    if (hasContent && isRecording) {
      btn.className = 'btn-action state-active';
    } else {
      btn.className = 'btn-action state-idle';
    }
  }

  function triggerUndoState() {
    isUndoActive = true;
    const btn = document.getElementById('btnAction');

    // 500ms crossfade into Red Undo
    document.getElementById('iconX').style.opacity = '0';
    document.getElementById('iconUndo').style.opacity = '1';
    btn.className = 'btn-action state-undo';

    // Green frame on input + "Saved!" ghost text for 5s (fading 1:1 with Undo)
    triggerSavedInputFeedback();

    clearTimeout(undoTimer);
    // Stays for 5s, then 500ms crossfade back to X and normal frame
    undoTimer = setTimeout(() => {
      isUndoActive = false;
      clearSavedInputFeedback();
      updateUIStates();
    }, 5000);
  }

  function handleActionButtonClick() {
    if (isUndoActive) {
      clearTimeout(undoTimer);
      isUndoActive = false;
      clearSavedInputFeedback();

      fetch(apiUrl("/api/undo_marker"), { method: "POST" })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            savedMarkersCount = Math.max(0, data.count);
            updateMarkerCounter();
            updateUIStates();
          }
        })
        .catch(() => {});

      updateUIStates();
      return;
    }

    const input = document.getElementById('dockInput');
    input.value = '';
    resetClockButton();
  }

  document.getElementById('dockInput').addEventListener('input', () => {
    clearSavedInputFeedback();
    updateUIStates();
  });

  document.getElementById('dockInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSaveAction();
    if (e.key === 'Escape') {
      document.getElementById('dockInput').value = '';
      resetClockButton();
    }
  });

  // Physical F8 listener inside dock window
  window.addEventListener('keydown', (e) => {
    if (e.key === 'F8') {
      e.preventDefault();
      if (isRecording) {
        handleKeybindFreeze();
      }
    }
  });

  // --- SAVE LOGIC ---
  function handleSaveAction() {
    if (!isRecording) return;
    const input = document.getElementById('dockInput');
    const desc = input.value.trim();
    if (!desc) return; // Non-empty guard!

    const timeToSave = selectedTimestamp || currentRecordingTimecode;

    commitMarker(timeToSave, desc);

    input.value = '';
    resetClockButton();
    updateUIStates();
  }

  function commitMarker(time, desc) {
    // Only show Saved!/Undo after the server confirms the write.
    // On failure show a transient error placeholder instead of fake success.
    // Paused flag travels for diagnostics; exports stay timecode-only.
    const wasPaused = isPaused;
    fetch(apiUrl("/api/save_marker"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ timecode: time, name: desc, paused: wasPaused })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        savedMarkersCount = data.count || (savedMarkersCount + 1);
        updateMarkerCounter();
        triggerUndoState();
      } else {
        throw new Error(data.error || "save failed");
      }
    })
    .catch(err => {
      console.error("Save error:", err);
      const input = document.getElementById('dockInput');
      const prev = input.placeholder;
      // Surface server messages (e.g. "No formats enabled - tick a format
      // in Tools > Scripts") instead of a generic retry note.
      const msg = (err && err.message) ? err.message : 'Save failed - retry';
      input.placeholder = msg.length > 60 ? msg.slice(0, 60) : msg;
      const shown = input.placeholder;
      setTimeout(() => { if (input.placeholder === shown) input.placeholder = prev; }, 2500);
    });
  }

  // --- PRESETS & RIGHT CLICK DELETION ---
  // Source of truth is server presets.json (survives reinstalls/profiles);
  // localStorage stays as an offline cache.
  function syncPresetsToServer() {
    fetch(apiUrl("/api/presets"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ presets: userPresets })
    }).catch(() => {});
  }

  function loadPresetsFromServer() {
    fetch(apiUrl("/api/presets"))
      .then(res => res.json())
      .then(data => {
        if (data && Array.isArray(data.presets) && data.presets.length > 0) {
          userPresets = data.presets;
          renderChips();
        }
      })
      .catch(() => {});
  }

  function renderChips() {
    const container = document.getElementById('chipContainer');
    container.innerHTML = '';

    userPresets.forEach((tag, idx) => {
      const chip = document.createElement('div');
      chip.className = 'dock-chip';
      chip.textContent = tag;
      chip.title = `Left-click: save "${tag}" | Right-click: delete tag`;

      chip.onclick = () => {
        if (!isRecording) return;
        const timeToSave = selectedTimestamp || currentRecordingTimecode;
        commitMarker(timeToSave, tag);
        resetClockButton();
      };

      chip.oncontextmenu = (e) => {
        e.preventDefault();
        deleteTag(idx);
      };

      container.appendChild(chip);
    });

    localStorage.setItem('obs_marker_chips_v5', JSON.stringify(userPresets));
  }

  function morphToInput() {
    const wrap = document.getElementById('tagMorphWrap');
    wrap.innerHTML = `<input type="text" id="morphInput" class="input-tag-morph" placeholder="Tag..." maxlength="24">`;
    const input = document.getElementById('morphInput');
    input.focus();

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value.trim();
        if (val && !userPresets.includes(val)) {
          userPresets.push(val);
          renderChips();
          syncPresetsToServer();
        }
        revertMorph();
      } else if (e.key === 'Escape') {
        revertMorph();
      }
    });

    input.addEventListener('blur', () => {
      setTimeout(revertMorph, 150);
    });
  }

  function revertMorph() {
    const wrap = document.getElementById('tagMorphWrap');
    wrap.innerHTML = `<button class="btn-tag-morph" id="btnTagMorph" onclick="morphToInput()">+ tag</button>`;
  }

  function deleteTag(idx) {
    userPresets.splice(idx, 1);
    renderChips();
    syncPresetsToServer();
  }

  // --- OBS WEBSOCKET & RECORDING STATE ---
  function setRecordingUIState(recording) {
    isRecording = recording;
    if (!recording) {
      setPausedUIState(false, true);
    }
    const btnClock = document.getElementById('btnClock');
    const input = document.getElementById('dockInput');

    if (recording) {
      document.body.classList.add('recording');
      btnClock.disabled = isPaused;
      input.disabled = false;
      if (!isSavedActive) {
        input.placeholder = isPaused ? 'Paused - time held...' : 'Description...';
      }
      input.title = isPaused ? 'Recording paused - resume to grab fresh timecode' : '';
      updateMarkerCounter();
    } else {
      document.body.classList.remove('recording');
      btnClock.disabled = true;
      resetClockButton();
      input.disabled = true;
      input.value = '';
      input.placeholder = 'Start rec to begin marking';
      input.title = 'Start recording in OBS to enable markers';
      clearSavedInputFeedback();
      updateMarkerCounter();
    }
    updateUIStates();
  }

  function setPausedUIState(paused, silent) {
    if (isPaused === paused) return;
    const wasPaused = isPaused;
    isPaused = paused;
    if (!silent) {
      fetch(apiUrl("/api/config"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paused: paused })
      }).catch(() => {});
    }
    if (!isRecording) {
      clearTimeout(resumeFallbackTimer);
      isResuming = false;
      return;
    }
    const btnClock = document.getElementById('btnClock');
    const input = document.getElementById('dockInput');
    btnClock.disabled = paused;
    if (!isSavedActive) {
      input.placeholder = paused ? 'Paused - time held...' : 'Description...';
    }
    input.title = paused ? 'Recording paused - resume to grab fresh timecode' : '';
    if (paused) {
      pendingFreeze = false;
      clearTimeout(resumeFallbackTimer);
      isResuming = false;
    } else if (wasPaused) {
      // Just resumed: timecode is stale until the async status round-trip
      // lands. Hold a short resuming guard so freezes defer to fresh time.
      isResuming = true;
      clearTimeout(resumeFallbackTimer);
      resumeFallbackTimer = setTimeout(() => { isResuming = false; }, 1500);
      queryRecordStatus();
    }
    updateFpsTooltip();
    updateUIStates();
  }

  function initObsWebSocket() {
    const port = WS_PORTS[portIndex % WS_PORTS.length];
    try {
      obsSocket = new WebSocket(`ws://127.0.0.1:${port}`);

      obsSocket.onopen = () => {
        wsAuthRequired = false;
        obsSocket.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 65 } }));
      };

      obsSocket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.op === 0) {
            // Hello: if OBS requires authentication we cannot proceed without a password.
            if (msg.d && msg.d.authentication) {
              wsAuthRequired = true;
              const input = document.getElementById('dockInput');
              if (input && !isRecording) {
                input.placeholder = 'Enable WS without password (Tools > WebSocket)';
                input.title = 'OBS WebSocket requires a password. Disable authentication in OBS Tools > WebSocket Server Settings, or add password support.';
              }
              try { obsSocket.close(); } catch (e) {}
              return;
            }
          }
          if (msg.op === 2) {
            queryRecordStatus();
            queryRecordDirectory();
            queryVideoSettings();
          }
          if (msg.op === 5 && msg.d.eventType === "RecordStateChanged") {
            const active = !!msg.d.eventData.outputActive;
            const state = (msg.d.eventData.outputState || "").toUpperCase();
            setRecordingUIState(active);
            if (!active) {
              // outputPath only exists on STOPPED. Finalize (video-stem rename)
              // first so reset doesn't wipe the session before the rename.
              const outputPath = (msg.d.eventData && msg.d.eventData.outputPath) || "";
              const doReset = () => {
                fetch(apiUrl("/api/reset_session"), { method: "POST" }).catch(() => {});
                savedMarkersCount = 0;
                updateMarkerCounter();
              };
              if (outputPath) {
                fetch(apiUrl("/api/finalize_session"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ output_path: outputPath })
                }).catch(() => {}).finally(doReset);
              } else {
                doReset();
              }
            } else {
              if (state.indexOf("PAUSED") !== -1) {
                setPausedUIState(true);
              } else if (state.indexOf("RESUMED") !== -1 || state.indexOf("STARTED") !== -1) {
                setPausedUIState(false);
              }
              queryRecordDirectory();
              queryVideoSettings();
              queryRecordStatus();
            }
          }
          if (msg.op === 7 && msg.d.requestType === "GetRecordStatus" && msg.d.responseData) {
            const active = msg.d.responseData.outputActive;
            if (isRecording !== active) {
              setRecordingUIState(active);
            }
            if (typeof msg.d.responseData.outputPaused === "boolean") {
              setPausedUIState(msg.d.responseData.outputPaused);
            }
            if (active && msg.d.responseData.outputTimecode) {
              // While paused the timecode stalls at the pause point; keep it
              // but do not treat the stall as a fresh freeze.
              currentRecordingTimecode = msg.d.responseData.outputTimecode.split(".")[0];
              lastTimecodeAt = Date.now();
              if (!isPaused) {
                // Fresh post-resume timecode arrived: release the guard so
                // deferred freezes lock the live value, not the pause point.
                if (isResuming) {
                  isResuming = false;
                  clearTimeout(resumeFallbackTimer);
                }
                applyFreshFreeze(currentRecordingTimecode);
              } else {
                pendingFreeze = false;
              }
              updateFpsTooltip();
            } else {
              pendingFreeze = false;
            }
          }
          if (msg.op === 7 && msg.d.requestType === "GetRecordDirectory" && msg.d.responseData) {
            const dir = msg.d.responseData.recordDirectory;
            if (dir) {
              fetch(apiUrl("/api/config"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ recording_dir: dir })
              }).catch(() => {});
            }
          }
          if (msg.op === 7 && msg.d.requestType === "GetVideoSettings" && msg.d.responseData) {
            const num = parseInt(msg.d.responseData.fpsNumerator, 10);
            const den = parseInt(msg.d.responseData.fpsDenominator, 10);
            // OBS reports NTSC as full ratios (60000/1001); validate the rate.
            const fps = (den > 0) ? num / den : NaN;
            if (Number.isFinite(fps) && fps >= 1 && fps <= 240 && den >= 1 && den <= 10000) {
              currentFpsNum = num;
              currentFpsDen = den;
              updateFpsTooltip();
              fetch(apiUrl("/api/config"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fps_num: num, fps_den: den })
              }).catch(() => {});
            }
          }
        } catch (e) {}
      };

      obsSocket.onclose = () => {
        lastTimecodeAt = 0;
        isResuming = false;
        clearTimeout(resumeFallbackTimer);
        clearTimeout(staleFallbackTimer);
        setRecordingUIState(false);
        portIndex++;
        setTimeout(initObsWebSocket, 2000);
      };

      obsSocket.onerror = () => {
        obsSocket.close();
      };
    } catch (e) {
      portIndex++;
      setTimeout(initObsWebSocket, 2000);
    }
  }

  function queryRecordStatus() {
    if (obsSocket && obsSocket.readyState === WebSocket.OPEN) {
      obsSocket.send(JSON.stringify({
        op: 6,
        d: { requestType: "GetRecordStatus", requestId: "req_rec_status" }
      }));
    }
  }

  function queryRecordDirectory() {
    if (obsSocket && obsSocket.readyState === WebSocket.OPEN) {
      obsSocket.send(JSON.stringify({
        op: 6,
        d: { requestType: "GetRecordDirectory", requestId: "req_rec_dir" }
      }));
    }
  }

  function queryVideoSettings() {
    if (obsSocket && obsSocket.readyState === WebSocket.OPEN) {
      obsSocket.send(JSON.stringify({
        op: 6,
        d: { requestType: "GetVideoSettings", requestId: "req_video_settings" }
      }));
    }
  }

  setInterval(queryRecordStatus, 1000);

  // --- HIGH-FREQUENCY STATUS & GLOBAL HOTKEY SYNC ---
  function pollServerSync() {
    fetch(apiUrl("/api/status"))
      .then(res => res.json())
      .then(data => {
        if (typeof data.markers_count === "number") {
          savedMarkersCount = Math.max(0, data.markers_count);
          updateMarkerCounter();
          updateUIStates();
        }
        if (typeof data.fps_num === "number" && typeof data.fps_den === "number") {
          if (data.fps_num !== currentFpsNum || data.fps_den !== currentFpsDen) {
            currentFpsNum = data.fps_num;
            currentFpsDen = data.fps_den;
            updateFpsTooltip();
          }
        }
        if (data.port !== undefined && data.port !== null) {
          const ps = String(data.port);
          if (ps !== serverPort) {
            serverPort = ps;
            updateFpsTooltip();
          }
        }

        // Global hotkey trigger detection.
        // First poll establishes a baseline without firing, so the very first
        // real F8 press is not swallowed.
        if (typeof data.freeze_event === "number" && data.freeze_event > 0) {
          if (lastKnownFreezeTime === null) {
            lastKnownFreezeTime = data.freeze_event;
          } else if (data.freeze_event > lastKnownFreezeTime) {
            lastKnownFreezeTime = data.freeze_event;
            if (isRecording) {
              handleKeybindFreeze();
            }
          }
        } else if (lastKnownFreezeTime === null && typeof data.freeze_event === "number") {
          lastKnownFreezeTime = data.freeze_event;
        }
        // Refresh stale visuals (dimming + tooltip) so a dead WebSocket
        // surfaces within ~150ms without waiting for other events.
        updateFpsTooltip();
      })
      .catch(() => {
        // Server unreachable: still refresh so stale dimming appears.
        refreshStaleClock();
      });
  }

  // Poll at 150ms for responsive global in-game hotkey detection
  setInterval(pollServerSync, 150);

  // Init
  renderChips();
  loadPresetsFromServer();
  initObsWebSocket();
  pollServerSync();
  discoverDaemonPort();
</script>
</body>
</html>
